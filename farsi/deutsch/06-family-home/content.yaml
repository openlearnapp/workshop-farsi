version: 1
number: 6
title: "خانواده و خانه"
description: "واژگان مهم آلمانی درباره روابط خانوادگی و زندگی در خانه"
sections:
  - title: "اعضای خانواده"
    explanation: |
      **خانواده** (Familie) در فرهنگ آلمانی جایگاه ویژه‌ای دارد.
      در آلمانی، اسم‌ها دارای جنس دستوری هستند (مذکر، مؤنث، خنثی) —
      این یکی از ویژگی‌های مهم زبان آلمانی است که باید یاد بگیرید.
    examples:
      - q: "Vater"
        a: "پدر"
        rel:
          - ["Vater", "پدر", "رابطه خانوادگی"]
      - q: "Mutter"
        a: "مادر"
        rel:
          - ["Mutter", "مادر", "رابطه خانوادگی"]
      - q: "Bruder"
        a: "برادر"
        rel:
          - ["Bruder", "برادر", "رابطه خانوادگی"]
      - q: "Schwester"
        a: "خواهر"
        rel:
          - ["Schwester", "خواهر", "رابطه خانوادگی"]
      - q: "Großvater"
        a: "پدربزرگ"
        rel:
          - ["Großvater", "پدربزرگ", "رابطه خانوادگی"]
      - q: "Großmutter"
        a: "مادربزرگ"
        rel:
          - ["Großmutter", "مادربزرگ", "رابطه خانوادگی"]
      - q: "Kind"
        a: "فرزند / بچه"
        rel:
          - ["Kind", "فرزند", "رابطه خانوادگی"]
  - title: "خانه و زندگی"
    explanation: |
      **خانه** (Haus) در فرهنگ آلمانی محل سکونت و استراحت است.
      آلمانی‌ها معمولاً در آپارتمان (Wohnung) زندگی می‌کنند.
      مهمان‌نوازی در آلمان گرم و صمیمانه است، اما ساختارمندتر از فرهنگ ایرانی.
    examples:
      - q: "Haus"
        a: "خانه"
        rel:
          - ["Haus", "خانه", "اسم"]
      - q: "Zimmer"
        a: "اتاق"
        rel:
          - ["Zimmer", "اتاق", "اسم"]
      - q: "Küche"
        a: "آشپزخانه"
        rel:
          - ["Küche", "آشپزخانه", "اسم"]
      - q: "Badezimmer"
        a: "حمام"
        rel:
          - ["Badezimmer", "حمام", "اسم"]
      - q: "Garten"
        a: "باغ"
        rel:
          - ["Garten", "باغ", "اسم"]
      - q: "Tür"
        a: "در"
        rel:
          - ["Tür", "در", "اسم"]
  - title: "جملات روزمره در خانه"
    explanation: |
      **در زندگی روزمره** این جملات پرکاربرد هستند.
      در آلمانی، افعال جایگاه ثابتی در جمله دارند — فعل همیشه دومین عنصر جمله است.
      این جملات به شما کمک می‌کنند درباره خانه و خانواده‌تان صحبت کنید.
    examples:
      - q: "Meine Familie ist groß"
        a: "خانواده‌ام بزرگ است"
        rel:
          - ["Meine", "مال من / خانواده‌ام", "ضمیر ملکی"]
          - ["Familie", "خانواده", "اسم"]
          - ["groß", "بزرگ", "صفت"]
      - q: "Ich bin zu Hause"
        a: "در خانه هستم"
        rel:
          - ["zu Hause", "در خانه", "عبارت مکانی"]
          - ["bin", "هستم", "فعل بودن"]
      - q: "Wir haben Gäste"
        a: "مهمان داریم"
        rel:
          - ["Gäste", "مهمانان", "اسم جمع"]
          - ["haben", "داریم / داشتن", "فعل"]
      - q: "Bitte, setzen Sie sich"
        a: "بفرمایید، بنشینید"
        rel:
          - ["Bitte", "لطفاً", "عبارت مؤدبانه"]
          - ["setzen Sie sich", "بنشینید", "فعل"]
      - q: "Mein Haus ist in Berlin"
        a: "خانه‌ام در برلین است"
        rel:
          - ["Mein Haus", "خانه‌ام", "اسم + ضمیر ملکی"]
          - ["Berlin", "برلین", "اسم خاص"]
