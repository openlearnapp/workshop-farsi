version: 1
number: 10
title: "احساسات و نظرات"
description: "عبارات آلمانی برای احساسات، نظرات و افکار شخصی"
sections:
  - title: "احساسات و عواطف"
    explanation: |
      **بیان احساسات** (Gefühle ausdrücken) بخش مهمی از هر زبانی است.
      آلمانی دارای واژگان دقیق و بیانگر برای احساسات مختلف است.
      یکی از معروف‌ترین کلمات آلمانی «Schadenfreude» است — خوشحالی از بدبختی دیگران.
    examples:
      - q: "Ich bin glücklich"
        a: "خوشحالم"
        rel:
          - ["glücklich", "خوشحال / شاد", "صفت"]
          - ["bin", "هستم", "فعل"]
      - q: "Ich bin traurig"
        a: "ناراحتم / غمگینم"
        rel:
          - ["traurig", "غمگین / ناراحت", "صفت"]
      - q: "Ich bin wütend"
        a: "عصبانی هستم"
        rel:
          - ["wütend", "عصبانی / خشمگین", "صفت"]
      - q: "Ich habe Angst"
        a: "می‌ترسم / ترس دارم"
        rel:
          - ["Angst", "ترس", "اسم"]
          - ["habe", "دارم", "فعل"]
      - q: "Ich mag es"
        a: "دوست دارم"
        rel:
          - ["mag", "دوست دارم / می‌پسندم", "فعل"]
      - q: "Es tut mir leid"
        a: "متأسفم / ببخشید"
        rel:
          - ["leid", "متأسف / ناراحت", "صفت"]
          - ["tut mir leid", "متأسفم", "عبارت"]
      - q: "Ich bin begeistert"
        a: "هیجان‌زده‌ام"
        rel:
          - ["begeistert", "مشتاق / هیجان‌زده", "صفت"]
  - title: "بیان نظر"
    explanation: |
      **بیان نظر** (Meinung äußern) در مکالمات آلمانی بسیار رایج است.
      آلمانی‌ها معمولاً مستقیم و صادق نظر می‌دهند —
      این برخلاف فرهنگ تعارف ایرانی است، اما به معنای بی‌ادبی نیست.
    examples:
      - q: "Meiner Meinung nach ..."
        a: "به نظر من ..."
        rel:
          - ["Meinung", "نظر / عقیده", "اسم"]
          - ["meiner", "مال من", "ضمیر ملکی"]
      - q: "Ich denke, dass ..."
        a: "فکر می‌کنم که ..."
        rel:
          - ["denke", "فکر می‌کنم", "فعل"]
          - ["dass", "که", "接続詞"]
      - q: "Ich stimme zu"
        a: "موافقم"
        rel:
          - ["stimme zu", "موافقم", "فعل"]
      - q: "Ich stimme nicht zu"
        a: "مخالفم"
        rel:
          - ["nicht", "نه / نخیر", "قید نفی"]
          - ["stimme nicht zu", "مخالفم", "فعل"]
      - q: "Das stimmt"
        a: "درست است"
        rel:
          - ["stimmt", "درست است / صحیح است", "فعل"]
  - title: "آرزوها و برنامه‌ها"
    explanation: |
      **بیان آرزوها و برنامه‌ها** به پایان دادن مکالمات به شکل طبیعی کمک می‌کند.
      با این عبارات می‌توانید درباره آینده، امیدها و برنامه‌هایتان به آلمانی صحبت کنید.
      تبریک می‌گوییم — شما ۱۰ درس آلمانی را تمام کردید!
    examples:
      - q: "Ich möchte ..."
        a: "می‌خواهم ..."
        rel:
          - ["möchte", "می‌خواهم / دوست دارم", "فعل"]
      - q: "Ich wünsche mir"
        a: "آرزو می‌کنم"
        rel:
          - ["wünsche", "آرزو می‌کنم", "فعل"]
          - ["mir", "برای خودم", "ضمیر"]
      - q: "Ich hoffe"
        a: "امیدوارم"
        rel:
          - ["hoffe", "امیدوارم", "فعل"]
      - q: "Ich habe einen Plan"
        a: "برنامه دارم"
        rel:
          - ["Plan", "برنامه / نقشه", "اسم"]
          - ["habe", "دارم", "فعل"]
      - q: "Danke, dass Sie gelernt haben!"
        a: "ممنون که یاد گرفتید!"
        rel:
          - ["Danke", "ممنون", "عبارت مؤدبانه"]
          - ["gelernt haben", "یاد گرفتید", "فعل"]
