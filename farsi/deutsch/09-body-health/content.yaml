version: 1
number: 9
title: "بدن و سلامتی"
description: "واژگان آلمانی برای اعضای بدن، سلامتی و نزد دکتر"
sections:
  - title: "اعضای بدن"
    explanation: |
      **اعضای بدن** (Körperteile) دانستن آن‌ها در زندگی روزمره بسیار مفید است —
      چه نزد دکتر، چه در توصیف ساده موقعیت‌ها.
      در آلمانی، هر عضو بدن جنس دستوری مشخصی دارد که باید یاد گرفته شود.
    examples:
      - q: "Kopf"
        a: "سر"
        rel:
          - ["Kopf", "سر", "عضو بدن"]
      - q: "Auge"
        a: "چشم"
        rel:
          - ["Auge", "چشم", "عضو بدن"]
      - q: "Hand"
        a: "دست"
        rel:
          - ["Hand", "دست", "عضو بدن"]
      - q: "Fuß"
        a: "پا"
        rel:
          - ["Fuß", "پا", "عضو بدن"]
      - q: "Mund"
        a: "دهان"
        rel:
          - ["Mund", "دهان", "عضو بدن"]
      - q: "Herz"
        a: "قلب"
        rel:
          - ["Herz", "قلب", "عضو بدن"]
      - q: "Rücken"
        a: "پشت"
        rel:
          - ["Rücken", "پشت", "عضو بدن"]
  - title: "نزد دکتر"
    explanation: |
      **نزد دکتر** (beim Arzt) باید بتوانید علائم خود را توصیف کنید.
      در آلمان، سیستم بهداشتی بسیار سازمان‌یافته است و بیمه درمانی اجباری است.
      این جملات به شما کمک می‌کنند مشکلات سلامتی خود را به آلمانی بیان کنید.
    examples:
      - q: "Ich habe Schmerzen"
        a: "دردم می‌آید / درد دارم"
        rel:
          - ["Schmerzen", "دردها / دردم می‌آید", "اسم جمع"]
          - ["habe", "دارم", "فعل"]
      - q: "Mein Kopf tut weh"
        a: "سرم درد می‌کند"
        rel:
          - ["Kopf", "سر", "اسم"]
          - ["tut weh", "درد می‌کند", "فعل"]
      - q: "Ich habe Fieber"
        a: "تب دارم"
        rel:
          - ["Fieber", "تب", "اسم"]
          - ["habe", "دارم", "فعل"]
      - q: "Medikament"
        a: "دارو"
        rel:
          - ["Medikament", "دارو", "اسم"]
      - q: "Apotheke"
        a: "داروخانه"
        rel:
          - ["Apotheke", "داروخانه", "اسم"]
      - q: "Ich brauche einen Arzt"
        a: "به دکتر نیاز دارم"
        rel:
          - ["brauche", "نیاز دارم", "فعل"]
          - ["Arzt", "دکتر", "اسم"]
  - title: "سلامتی و تندرستی"
    explanation: |
      **سلامتی** (Gesundheit) موضوع مهمی در فرهنگ آلمانی است.
      وقتی کسی عطسه می‌کند، آلمانی‌ها می‌گویند «Gesundheit!» (به سلامتی!) —
      این یک سنت اجتماعی رایج در آلمان است.
    examples:
      - q: "Mir geht es gut"
        a: "حالم خوب است"
        rel:
          - ["gut", "خوب", "صفت"]
          - ["geht es", "می‌رود / حالم است", "فعل"]
      - q: "Ich bin müde"
        a: "خسته‌ام"
        rel:
          - ["müde", "خسته", "صفت"]
          - ["bin", "هستم", "فعل"]
      - q: "Ich bin krank"
        a: "بیمار هستم"
        rel:
          - ["krank", "بیمار / مریض", "صفت"]
      - q: "Ich ruhe mich aus"
        a: "استراحت می‌کنم"
        rel:
          - ["ruhe aus", "استراحت می‌کنم", "فعل"]
      - q: "Gesundheit!"
        a: "به سلامتی!"
        rel:
          - ["Gesundheit", "سلامتی", "اسم"]
