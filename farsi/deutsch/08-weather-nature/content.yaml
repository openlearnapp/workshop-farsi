version: 1
number: 8
title: "آب‌وهوا و طبیعت"
description: "واژگان آلمانی برای آب‌وهوا، فصل‌ها و طبیعت"
sections:
  - title: "آب‌وهوا"
    explanation: |
      **آب‌وهوا** (Wetter) یک موضوع مکالمه‌ای جهانی است.
      آلمان دارای آب‌وهوای معتدل است با زمستان‌های سرد و تابستان‌های گرم.
      صحبت درباره آب‌وهوا یکی از رایج‌ترین موضوعات در مکالمات روزمره آلمانی است.
    examples:
      - q: "Das Wetter ist sonnig"
        a: "هوا آفتابی است"
        rel:
          - ["Wetter", "هوا / آب‌وهوا", "اسم"]
          - ["sonnig", "آفتابی", "صفت"]
      - q: "Es regnet"
        a: "باران می‌بارد"
        rel:
          - ["regnet", "می‌بارد (باران)", "فعل"]
      - q: "Es schneit"
        a: "برف می‌بارد"
        rel:
          - ["schneit", "می‌بارد (برف)", "فعل"]
      - q: "Das Wetter ist warm"
        a: "هوا گرم است"
        rel:
          - ["warm", "گرم", "صفت"]
      - q: "Das Wetter ist kalt"
        a: "هوا سرد است"
        rel:
          - ["kalt", "سرد", "صفت"]
      - q: "Der Wind weht"
        a: "باد می‌وزد"
        rel:
          - ["Wind", "باد", "اسم"]
          - ["weht", "می‌وزد", "فعل"]
  - title: "فصل‌ها"
    explanation: |
      **فصل‌ها** (Jahreszeiten) در فرهنگ آلمانی اهمیت زیادی دارند.
      هر فصل جشن‌ها و سنت‌های خاص خود را دارد —
      مثلاً Weihnachten (کریسمس) در زمستان و Oktoberfest در پاییز.
    examples:
      - q: "Frühling"
        a: "بهار"
        rel:
          - ["Frühling", "بهار", "فصل"]
      - q: "Sommer"
        a: "تابستان"
        rel:
          - ["Sommer", "تابستان", "فصل"]
      - q: "Herbst"
        a: "پاییز"
        rel:
          - ["Herbst", "پاییز", "فصل"]
      - q: "Winter"
        a: "زمستان"
        rel:
          - ["Winter", "زمستان", "فصل"]
      - q: "Weihnachten ist im Winter"
        a: "کریسمس در زمستان است"
        rel:
          - ["Weihnachten", "کریسمس", "اسم خاص"]
          - ["im Winter", "در زمستان", "عبارت زمانی"]
  - title: "طبیعت و چشم‌انداز"
    explanation: |
      **طبیعت آلمان** (Natur) بسیار زیباست — از جنگل‌های سیاه (Schwarzwald)
      تا دریاچه‌های بایرن و ساحل دریای شمال.
      بسیاری از آلمانی‌ها به طبیعت‌گردی و پیاده‌روی (Wandern) علاقه دارند.
    examples:
      - q: "Berg"
        a: "کوه"
        rel:
          - ["Berg", "کوه", "اسم"]
      - q: "Meer"
        a: "دریا"
        rel:
          - ["Meer", "دریا", "اسم"]
      - q: "Fluss"
        a: "رودخانه"
        rel:
          - ["Fluss", "رودخانه", "اسم"]
      - q: "Wald"
        a: "جنگل"
        rel:
          - ["Wald", "جنگل", "اسم"]
      - q: "Wüste"
        a: "بیابان / صحرا"
        rel:
          - ["Wüste", "بیابان", "اسم"]
      - q: "Der Himmel ist blau"
        a: "آسمان آبی است"
        rel:
          - ["Himmel", "آسمان", "اسم"]
          - ["blau", "آبی", "صفت"]
